name: Build image, push to ECR, and deploy

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

on:
  push:
    branches: [ "master" ]

env:
  IMAGE_TAG: ${{ vars.SEMANTIC_VERSION }}-${{ github.sha }}

jobs:
  deploy-ecr-image:
    name: Build and push image to ECR
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
      with:
        aws-region: ap-southeast-1
        role-to-assume: ${{ secrets.DEPLOY_AWS_ROLE_TO_ASSUME }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push docker image to Amazon ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: simplebank
      run: |
        docker build -f Dockerfile.prod -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: deploy-ecr-image

    steps:
    - name: Tailscale setup for SSH Access
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Wait for tailscale to connect
      run: sleep 10

    - name: SSH and execute deployment script
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          export ECR_REPO=${{ vars.ECR_REPO}}
          export IMAGE_TAG=$IMAGE_TAG
          cd app/go-bank/
          ./deploy.sh
