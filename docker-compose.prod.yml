version: '3.9'

services:
  postgres:
    image: postgres:12-alpine
    container_name: pg12-bank
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: simple_bank
    ports:
      - "5432:5432"
    networks:
      - bank-network
    volumes:
      - pg12-bankdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d simple_bank"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    image: migrate/migrate
    volumes:
      - ./db/migration:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: [
      "-path", "/migrations",
      "-database", "postgresql://root:secret@pg12-bank:5432/simple_bank?sslmode=disable",
      "up"
    ]
    networks:
      - bank-network
  
  app:
    image: ${ECR_REPO}:${IMAGE_TAG}
    container_name: simplebank-app
    restart: unless-stopped
    env_file: ./app.env
    environment:
      - IS_PRODUCTION=true
      - GIN_MODE=release
      - DB_SOURCE=postgresql://root:secret@pg12-bank:5432/simple_bank?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - bank-network

volumes:
  pg12-bankdata:

networks:
  bank-network:
    driver: bridge
  tunnel:
    external: true
